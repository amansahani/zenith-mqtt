[package]
name = "zenith-broker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core session, QoS state machines, and routing logic for Zenith MQTT"

[features]
default = ["std"]
std = ["zenith-core/std", "zenith-trie/std"]
alloc = ["zenith-core/alloc", "zenith-trie/alloc"]

[dependencies]
zenith-core = { path = "../zenith-core", default-features = false }
zenith-trie = { path = "../zenith-trie", default-features = false }
